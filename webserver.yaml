---
- name: Install and configure Apache webserver
  hosts: web
  become: true

  vars:
    httpd_pkg: "{{ 'httpd' if ansible_os_family == 'RedHat' else 'apache2' }}"
    httpd_svc: "{{ 'httpd' if ansible_os_family == 'RedHat' else 'apache2' }}"
    httpd_port: 80
    doc_root: /var/www/html
    index_title: "Hello from Ansible!"
    index_body: "This page is served by Apache managed by Ansible."

  tasks:
    - name: Install Apache package
      ansible.builtin.package:
        name: "{{ httpd_pkg }}"
        state: present

    - name: Ensure document root exists
      ansible.builtin.file:
        path: "{{ doc_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy index.html
      ansible.builtin.copy:
        dest: "{{ doc_root }}/index.html"
        mode: "0644"
        content: |
          <!doctype html>
          <html>
            <head><title>{{ index_title }}</title></head>
            <body>
              <h1>{{ index_title }}</h1>
              <p>{{ index_body }}</p>
            </body>
          </html>
      notify: restart apache

    - name: Open firewall on RHEL/CentOS using firewalld
      when: ansible_os_family == "RedHat"
      block:
        - name: Ensure firewalld is installed
          ansible.builtin.package:
            name: firewalld
            state: present

        - name: Ensure firewalld is running and enabled
          ansible.builtin.service:
            name: firewalld
            state: started
            enabled: true

        - name: Allow HTTP service in firewalld
          ansible.posix.firewalld:
            service: http
            permanent: true
            state: enabled
            immediate: true

    - name: Open firewall on Debian/Ubuntu using UFW
      when: ansible_os_family == "Debian"
      block:
        - name: Ensure ufw is installed
          ansible.builtin.package:
            name: ufw
            state: present

        - name: Allow HTTP through ufw
          community.general.ufw:
            rule: allow
            port: "{{ httpd_port }}"
            proto: tcp

        - name: Enable ufw with default allow policy
          community.general.ufw:
            state: enabled
            policy: allow

    - name: Ensure Apache service is enabled and running
      ansible.builtin.service:
        name: "{{ httpd_svc }}"
        state: started
        enabled: true

  handlers:
    - name: Restart apache
      ansible.builtin.service:
        name: "{{ httpd_svc }}"
        state: restarted
